<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Tab Grouper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f11;
      color: #e8e8f0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .header-icon {
      font-size: 24px;
      line-height: 1;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .header-text p {
      font-size: 11px;
      color: #7b7b8f;
      margin-top: 2px;
    }

    .divider {
      border: none;
      border-top: 1px solid #1e1e2a;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #16161f;
      border: 1px solid #1e1e2a;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #7dd3fc;
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: #7b7b8f;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #16161f;
      border: 1px solid #1e1e2a;
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 11px;
      color: #7b7b8f;
      margin-bottom: 16px;
      width: 100%;
      justify-content: center;
    }

    .status-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    .status-pill.no-group .dot {
      background: #f87171;
      box-shadow: 0 0 6px #f87171;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.3px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .toast {
      margin-top: 10px;
      padding: 8px 12px;
      background: #16161f;
      border: 1px solid #1e1e2a;
      border-radius: 8px;
      font-size: 11px;
      color: #4ade80;
      text-align: center;
      display: none;
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      color: #f87171;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 10px;
      color: #3a3a4f;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
      <h1>AI Tab Grouper</h1>
      <p>Auto-groups your AI tabs</p>
    </div>
  </div>

  <hr class="divider" />

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="total-tabs">—</div>
      <div class="stat-label">Total Tabs</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="ai-tabs">—</div>
      <div class="stat-label">AI Tabs</div>
    </div>
  </div>

  <div class="status-pill" id="status-pill">
    <span class="dot"></span>
    <span id="status-text">Checking...</span>
  </div>

  <button class="btn btn-primary" id="rescan-btn">
    🔍 Scan & Group All AI Tabs
  </button>

  <div class="toast" id="toast"></div>

  <div class="footer">Supports 50+ AI domains</div>

  <script src="popup.js"></script>
</body>
</html>
